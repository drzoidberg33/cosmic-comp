[package]
name = "cosmic-comp-test-harness"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

# Standalone: not part of the parent workspace, has its own Cargo.lock.
[workspace]

[dependencies]
png = "0.18"
rustix = { version = "1", features = ["event", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
